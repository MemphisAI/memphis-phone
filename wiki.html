<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https://api.github.com; manifest-src 'self'; worker-src 'self'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060605">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/memphis-app-256.png">
<title>Wiki</title>
<link rel="stylesheet" href="branding/blades-ui.css">
<link rel="stylesheet" href="shared/wiki.css">
<link rel="stylesheet" href="phone-shell.css">
<link rel="stylesheet" href="wiki-phone.css">
</head>
<body data-page="wiki">
<header id="top">
  <button id="t-back" class="bl-btn ghost" type="button">Memphis</button>
  <div id="t-title" class="title">Wiki</div>
  <button id="t-badge" class="badge" type="button" aria-live="polite"></button>
</header>
<!-- the phone's own bar: Back through the pages, and the two strips as drawers -->
<header id="bar">
  <button id="b-back" class="bl-btn ghost sm" type="button" aria-label="Back to the page before">Back</button>
  <div class="spacer"></div>
  <button id="b-left" class="bl-btn coal sm" type="button" aria-controls="s-left" aria-expanded="false">Folders</button>
  <button id="b-right" class="bl-btn coal sm" type="button" aria-controls="s-right" aria-expanded="false">Layers</button>
</header>

<main id="page" tabindex="-1" aria-live="off"></main>
<div id="scrim" class="scrim" hidden></div>
<nav id="s-left" class="strip left" aria-label="Folders"></nav>
<aside id="s-right" class="strip right" aria-label="View and layers"></aside>
<footer id="s-bottom" class="strip bottom" aria-label="Tools">
  <div class="tools">
    <label class="find"><span class="find-ic" aria-hidden="true"></span><input id="find" type="search" placeholder="Find a page" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Find a page" enterkeyhint="go"></label>
    <div id="find-list" class="find-list" role="listbox" hidden></div>
    <button id="t-vault" class="bl-btn coal sm" type="button" hidden>Open in vault</button>
  </div>
</footer>
<div id="status" class="status" role="status" aria-live="polite"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="shared/sync-model.js"></script>
<script src="store.js"></script>
<script src="github.js"></script>
<script src="engine.js"></script>
<script src="apps.js"></script>
<script src="app.js"></script>
<script src="wiki-bridge.js"></script>
<script src="branding/blades-icons.js"></script>
<script src="shared/wiki-model.js"></script>
<script src="shared/wiki-sets.js"></script>
<script src="shared/wiki-ui.js"></script>
<script src="shared/wiki-sets-ui.js"></script>
<script src="shared/wiki-edit.js"></script>
<script src="shared/wiki-pages.js"></script>
<script src="wiki-phone.js"></script>
</body>
</html>
